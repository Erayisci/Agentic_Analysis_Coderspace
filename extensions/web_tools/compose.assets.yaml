# Optional overlay selected by web-tools when documents/images are enabled.
services:
  crawler:
    build:
      target: crawler-assets
    environment:
      WEB_ASSET_CACHE_DIR: /opt/web-tools-cache
      WEB_DOCUMENTS_ENABLED: "${WEB_DOCUMENTS_ENABLED:-false}"
      WEB_IMAGES_ENABLED: "${WEB_IMAGES_ENABLED:-false}"
      WEB_LINKS_ENABLED: "${WEB_LINKS_ENABLED:-false}"
      WEB_OCR_ENABLED: "${WEB_OCR_ENABLED:-false}"
      WEB_VISION_ENABLED: "${WEB_VISION_ENABLED:-false}"
      WEB_ASSET_CACHE_ENABLED: "${WEB_ASSET_CACHE_ENABLED:-false}"
      WEB_ASSET_MAX_BYTES: "${WEB_ASSET_MAX_BYTES:-10485760}"
      WEB_ASSET_TIMEOUT_SECONDS: "${WEB_ASSET_TIMEOUT_SECONDS:-120}"
      WEB_ASSET_MAX_CHARS: "${WEB_ASSET_MAX_CHARS:-20000}"
      WEB_ASSET_MAX_PAGES: "${WEB_ASSET_MAX_PAGES:-10}"
      WEB_ASSET_MAX_SHEETS: "${WEB_ASSET_MAX_SHEETS:-3}"
      WEB_ASSET_MAX_ROWS: "${WEB_ASSET_MAX_ROWS:-200}"
      WEB_ASSET_MAX_COLUMNS: "${WEB_ASSET_MAX_COLUMNS:-50}"
      WEB_ASSET_MAX_ARCHIVE_BYTES: "${WEB_ASSET_MAX_ARCHIVE_BYTES:-52428800}"
      WEB_ASSET_MAX_IMAGE_PIXELS: "${WEB_ASSET_MAX_IMAGE_PIXELS:-10000000}"
      WEB_ASSET_IMAGE_EDGE: "${WEB_ASSET_IMAGE_EDGE:-1600}"
      WEB_ASSET_MAX_LINKS: "${WEB_ASSET_MAX_LINKS:-50}"
      WEB_ASSET_MAX_IMAGES: "${WEB_ASSET_MAX_IMAGES:-3}"
      WEB_ASSET_CACHE_TTL_SECONDS: "${WEB_ASSET_CACHE_TTL_SECONDS:-3600}"
      WEB_ASSET_CACHE_MAX_BYTES: "${WEB_ASSET_CACHE_MAX_BYTES:-104857600}"
      WEB_OCR_MAX_PAGES: "${WEB_OCR_MAX_PAGES:-3}"
      WEB_OCR_PROVIDER: "${WEB_OCR_PROVIDER:-local}"
      WEB_OCR_LANGUAGES: "${WEB_OCR_LANGUAGES:-eng+tur}"
      WEB_MODEL_MAX_CALLS_PER_READ: "${WEB_MODEL_MAX_CALLS_PER_READ:-1}"
      WEB_MODEL_MAX_CALLS_PER_HOUR: "${WEB_MODEL_MAX_CALLS_PER_HOUR:-20}"
      WEB_MODEL_MAX_TOKENS: "${WEB_MODEL_MAX_TOKENS:-2048}"
      WEB_KLOUDEKS_BASE_URL: "${WEB_KLOUDEKS_BASE_URL:-https://mia.csp.kloudeks.com/v1}"
      WEB_KLOUDEKS_VISION_MODEL: "${WEB_KLOUDEKS_VISION_MODEL:-kkbhackathon2026/Qwen3.8-27B}"
      WEB_KLOUDEKS_OCR_MODEL: "${WEB_KLOUDEKS_OCR_MODEL:-kkbhackathon2026/Unlimited-OCR}"
      WEB_KLOUDEKS_API_KEY: "${WEB_KLOUDEKS_API_KEY:-${MIA_API_KEY:-}}"
    volumes:
      - asset-cache:/opt/web-tools-cache
  egress:
    environment:
      WEB_ASSET_TIMEOUT_SECONDS: "${WEB_ASSET_TIMEOUT_SECONDS:-120}"
volumes:
  asset-cache: {}
