[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kkb-agentic-analytics"
version = "0.1.0"
description = "Agentic data analytics over Turkish banking-regulator data (KKB Hackathon 2026)"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyarrow>=14.0.0",
    # Analysis tools: change detection, causality/stationarity tests.
    "ruptures>=1.1.0",
    "statsmodels>=0.14.0",
    # Web URL agent tool: fetch, PDF and HTML extraction.
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    # Agent layer: Kloudeks HTTP client, typed plan DSL, charts, eval scenarios.
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "plotly>=5.20.0",
    "PyYAML>=6.0",
    # API service.
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "flake8>=6.0.0"]

[project.scripts]
kkb-build = "backend.lakehouse.build:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
